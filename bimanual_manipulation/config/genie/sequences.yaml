# Predefined sequences for the Genie G2, called by name via ~/execute_sequence.
# See the Walker config for more elaborate examples (blends, follow, carry, ...).

sequences:

  both_ready:
    - {type: named, group: both_arms, named: ready}

  home:
    - {type: named, group: both_arms, named: home}

  # Straight-line reach with the left hand: 10 cm along the tool axis, then back.
  reach_left:
    - {type: cartesian, group: left_arm, relative: true, offset: [0.0, 0.0, 0.10],
       offset_in_tip_frame: true, cartesian_path: true, velocity_scaling: 0.15}
    - {type: cartesian, group: left_arm, relative: true, offset: [0.0, 0.0, -0.10],
       offset_in_tip_frame: true, cartesian_path: true, velocity_scaling: 0.15}
