# ---------------------------------------------------------------------------
# Predefined sequences, called by name through the ~/execute_sequence action
# (field: sequence_name).
#
# Step types:
#   named     -> named pose of the group               (fields: group, named)
#   joint     -> explicit joint values                 (fields: group, values)
#   cartesian -> straight-line tip move                 (fields: group, and
#                either absolute: position [x,y,z] + orientation [x,y,z,w]
#                or relative: true with offset [dx,dy,dz] and optional
#                offset_in_tip_frame: true)
#   gripper   -> actuate a gripper group   (needs a gripper controller; none on
#                this robot yet, so not used below)
#
# Optional on any step: velocity_scaling, acceleration_scaling.
# ---------------------------------------------------------------------------

sequences:

  # Bring both arms to a ready pose (both controllers move together).
  both_ready:
    - {type: named, group: both_arms, named: ready}

  home:
    - {type: named, group: both_arms, named: home}

  # Straight-line reach with the left hand: 10 cm forward along the tool axis,
  # then back. A grasp step (gripper) would go between the two when a hand
  # controller is available.
  reach_left:
    - {type: cartesian, group: left_arm, relative: true, offset: [0.0, 0.0, 0.10], offset_in_tip_frame: true, velocity_scaling: 0.15}
    - {type: cartesian, group: left_arm, relative: true, offset: [0.0, 0.0, -0.10], offset_in_tip_frame: true, velocity_scaling: 0.15}

  reach_right:
    - {type: cartesian, group: right_arm, relative: true, offset: [0.0, 0.0, 0.10], offset_in_tip_frame: true, velocity_scaling: 0.15}
    - {type: cartesian, group: right_arm, relative: true, offset: [0.0, 0.0, -0.10], offset_in_tip_frame: true, velocity_scaling: 0.15}

  # Pose target defined relative to a TF frame (MoveIt-like "pose in frame_id").
  # Here: bring the left tip 15 cm above an object frame 'target_object', then
  # descend straight down onto it.
  #   - reference_frame : any TF frame (object, fixture, camera, ...)
  #   - position/orientation : the delta pose in that frame
  #   - cartesian_path  : false = IK + joint interpolation (reach), true = straight line
  pick_above_object:
    - {type: cartesian, group: left_arm, reference_frame: target_object,
       position: [0.0, 0.0, 0.15], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: false}
    - {type: cartesian, group: left_arm, reference_frame: target_object,
       position: [0.0, 0.0, 0.02], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: true,
       velocity_scaling: 0.1}
