# ---------------------------------------------------------------------------
# Move group definitions  --  tuned for the UBTECH Walker S2.
#
# Joint names below are best-guess (link name without the "_link" suffix). If
# any is wrong, the server fails at startup with a message naming the actual
# chain joint, e.g.:
#     chain joint 'L_elbow' of group 'left_arm' is not listed in its 'joints'
# Just copy the real names here. Matching is by NAME, so the order does not
# matter; you can paste the controller's `joints` list verbatim:
#     ros2 param get /left_arm_controller joints
#
# A group is "Cartesian capable" as soon as both base_link and tip_link are
# given (single kinematic chain). Aggregate groups (e.g. both_arms) only do
# named / joint-space moves but may drive several controllers at once.
# ---------------------------------------------------------------------------

planning:
  default_velocity_scaling: 0.30
  default_acceleration_scaling: 0.30
  default_joint_velocity: 1.0        # rad/s, fallback if URDF has no <limit velocity>
  # Acceleration is almost never in the URDF, so this effectively sets it; too
  # low makes motion crawl through direction changes. Raise the scalings and/or
  # these for snappier motion.
  default_joint_acceleration: 10.0   # rad/s^2
  execution_timeout: 10.0            # s, extra wait beyond the trajectory's own duration
  # false -> constant (velocity-limited) speed across all steps, no slowdown at
  # corners / direction changes. true -> smooth the acceleration (slows near
  # sharp corners, gentler on the hardware).
  acceleration_limiting: false
  # When a straight-line joint move is blocked by an obstacle, fall back to an
  # RRT-Connect planner that routes around it (self + world objects). Cartesian
  # straight-line moves (cartesian_path: true) are never re-routed.
  avoid_obstacles: true
  rrt_max_iterations: 4000
  rrt_step: 0.35                     # rad, tree extension step
  rrt_edge_resolution: 0.06          # rad, coarse collision step during search
                                     # (final path re-checked at collision.resolution)

groups:

  left_arm:
    base_link: torso_link
    tip_link: L_industrial_hand_contact_frame
    cartesian_step: 0.005
    joints:
      - L_shoulder_pitch_joint
      - L_shoulder_roll_joint
      - L_shoulder_yaw_joint
      - L_elbow_roll_joint
      - L_elbow_yaw_joint
      - L_wrist_pitch_joint
      - L_wrist_roll_joint
    controllers:
      - name: /left_arm_controller/follow_joint_trajectory
        type: follow_joint_trajectory

  right_arm:
    base_link: torso_link
    tip_link: R_industrial_hand_contact_frame
    cartesian_step: 0.005
    joints:
      - R_shoulder_pitch_joint
      - R_shoulder_roll_joint
      - R_shoulder_yaw_joint
      - R_elbow_roll_joint
      - R_elbow_yaw_joint
      - R_wrist_pitch_joint
      - R_wrist_roll_joint
    controllers:
      - name: /right_arm_controller/follow_joint_trajectory
        type: follow_joint_trajectory

  # Both arms commanded at once: one joint-space goal, split across the two
  # arm controllers so they move simultaneously. No tip_link -> joint/named only.
  both_arms:
    joints:
      - L_shoulder_pitch_joint
      - L_shoulder_roll_joint
      - L_shoulder_yaw_joint
      - L_elbow_roll_joint
      - L_elbow_yaw_joint
      - L_wrist_pitch_joint
      - L_wrist_roll_joint
      - R_shoulder_pitch_joint
      - R_shoulder_roll_joint
      - R_shoulder_yaw_joint
      - R_elbow_roll_joint
      - R_elbow_yaw_joint
      - R_wrist_pitch_joint
      - R_wrist_roll_joint
    controllers:
      - name: /left_arm_controller/follow_joint_trajectory
        type: follow_joint_trajectory
        joints:
          - L_shoulder_pitch_joint
          - L_shoulder_roll_joint
          - L_shoulder_yaw_joint
          - L_elbow_roll_joint
          - L_elbow_yaw_joint
          - L_wrist_pitch_joint
          - L_wrist_roll_joint
      - name: /right_arm_controller/follow_joint_trajectory
        type: follow_joint_trajectory
        joints:
          - R_shoulder_pitch_joint
          - R_shoulder_roll_joint
          - R_shoulder_yaw_joint
          - R_elbow_roll_joint
          - R_elbow_yaw_joint
          - R_wrist_pitch_joint
          - R_wrist_roll_joint

  # Optional: enable the torso (waist) as its own group. Uncomment and fix the
  # joint names if you want to command it. The Walker S2 also exposes
  # waist_controller / head_controller.
  #
  # waist:
  #   joints: [waist_yaw, waist_pitch]
  #   controllers:
  #     - name: /waist_controller/follow_joint_trajectory
  #       type: follow_joint_trajectory

# NOTE: no gripper/hand JointTrajectory controller was detected on this robot,
# so gripper groups are omitted. When a hand controller exists, add a group
# with controller type "follow_joint_trajectory" or "gripper_command" and use
# MotionStep TYPE_GRIPPER.
