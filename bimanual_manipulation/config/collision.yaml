# ---------------------------------------------------------------------------
# Collision checking settings (FCL).
#
# Collisions between a link and its direct parent (and shapes on the same link)
# are always ignored. Add here any other pair that should be ignored, like an
# SRDF "disable_collisions" block.
#
# TIP for first bring-up: if every motion is rejected as "collision detected"
# while the robot clearly is not colliding, it usually means two non-adjacent
# links overlap by design at the home pose. Either add the pair below, or set
# `enabled: false` to validate the motion pipeline first, then re-enable and
# tune the pairs.
# ---------------------------------------------------------------------------

collision:
  enabled: true
  padding: 0.0          # uniform inflation of robot links [m] (safety margin)
  resolution: 0.02      # joint-space step between collision-checked waypoints [rad]

  disabled_pairs:
    - [torso_link, L_shoulder_pitch_link]
    - [torso_link, R_shoulder_pitch_link]
    - [torso_link, head_pitch_link]
    - [torso_link, head_yaw_link]
    # Arms vs torso/waist are common offenders near the home pose; uncomment as
    # needed once you see which pairs trip:
    # - [waist_pitch_link, L_shoulder_pitch_link]
    # - [waist_pitch_link, R_shoulder_pitch_link]
