# ---------------------------------------------------------------------------
# Predefined sequences, called by name through the ~/execute_sequence action
# (field: sequence_name).
#
# Step types:
#   named     -> named pose of the group               (fields: group, named)
#   joint     -> explicit joint values                 (fields: group, values)
#   cartesian -> straight-line tip move                 (fields: group, and
#                either absolute: position [x,y,z] + orientation [x,y,z,w]
#                or relative: true with offset [dx,dy,dz] and optional
#                offset_in_tip_frame: true)
#   gripper   -> actuate a gripper group   (needs a gripper controller; none on
#                this robot yet, so not used below)
#
# Optional on any step: velocity_scaling, acceleration_scaling.
# ---------------------------------------------------------------------------

sequences:

  # Bring both arms to a ready pose (both controllers move together).
  both_ready:
    - {type: named, group: both_arms, named: ready}
    - {type: named, group: waist, named: home}
  
  home:
    - {type: named, group: both_arms, named: home}

  ceva_box_pick:
    - {type: named, group: both_arms, named: safe_above_table}
    - {type: named, group: both_arms, named: pre_grasp}
    - {type: cartesian, group: left_arm, reference_frame: box,
       position: [0.0, 0.4, 0.0], cartesian_path: false}
    - {type: cartesian, group: right_arm, reference_frame: box,
       position: [0.0, -0.4, 0.0], cartesian_path: false}
    - {type: cartesian, group: both_arms, offsets: [[0.0, -0.20, 0.0], [0.0, 0.20, 0.0]], cartesian_path: true}
    - {type: cartesian, group: both_arms, offset: [0.0, 0.0, 0.15]}   # monte 15 cm
    - {type: cartesian, group: both_arms, offset: [-0.1, 0.0, 0.0]}   # puis 20 cm avant

  ceva_pick_inside_60:
    - {type: named, group: both_arms, named: safe_above_table}
    - {type: cartesian, group: right_arm, reference_frame: box,
        position: [0.1, -0.25, 0.1], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: false}
    - {type: cartesian, group: left_arm, reference_frame: box,
        position: [0.1, 0.25, 0.1], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: false}
    - {type: joint, group: left_wrist, joint_target: [0.75]}
    - {type: joint, group: right_wrist, joint_target: [0.75]}
    - {type: cartesian, group: both_arms, offsets: [[0.0, 0.05, 0.0], [0.0, -0.05, 0.0]], cartesian_path: true}
    - {type: cartesian, group: both_arms, offset: [0.0, 0.0, 0.15]}   # monte 15 cm
    - {type: cartesian, group: both_arms, offset: [-0.15, 0.0, 0.0]}   # rapproche 15 cm

  ceva_pick_inside_20:
    - {type: named, group: both_arms, named: safe_above_table}
    - {type: cartesian, group: right_arm, reference_frame: box,
        position: [0.1, -0.17, 0.1], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: false}
    - {type: cartesian, group: left_arm, reference_frame: box,
        position: [0.1, 0.17, 0.1], orientation: [1.0, 0.0, 0.0, 0.0], cartesian_path: false}
    - {type: joint, group: left_wrist, joint_target: [0.75]}
    - {type: joint, group: right_wrist, joint_target: [0.75]}
    - {type: cartesian, group: both_arms, offsets: [[0.0, 0.05, 0.0], [0.0, -0.05, 0.0]], cartesian_path: true}
    - {type: cartesian, group: both_arms, offset: [0.0, 0.0, 0.15]}   # monte 15 cm
    - {type: cartesian, group: both_arms, offset: [-0.15, 0.0, 0.0]}   # rapproche 15 cm